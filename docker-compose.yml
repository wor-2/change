services:
  db:
    image: postgres:16
    environment: {POSTGRES_PASSWORD: postgres, POSTGRES_DB: changemgmt}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 3s, retries: 20}
  web:
    build: .
    env_file: [.env.example]
    environment: {DATABASE_URL: "postgresql://postgres:postgres@db:5432/changemgmt"}
    ports: ["5000:5000"]
    volumes: [./uploads:/app/uploads]
    depends_on: {db: {condition: service_healthy}}
volumes: {pgdata: {}}

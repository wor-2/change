{% extends "base.html" %}{% block body %}<h1>Notification log</h1><div class="card"><table>
<tr><th>Time</th><th>Change</th><th>Channel</th><th>Recipient</th><th>Status</th></tr>
{% for r in rows %}<tr><td>{{ r.created_at.strftime('%d %b %H:%M') }}</td><td>{{ r.change_no }}</td><td>{{ r.channel }}</td><td>{{ r.recipient }}</td><td>{{ r.status }}</td></tr>{% else %}<tr><td colspan="5">Nothing sent yet.</td></tr>{% endfor %}</table></div>{% endblock %}
